<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص الشبكة – رحلة المبرمجة</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#0e5f76;color:#1d2b33;margin:0;padding:20px}
.card{background:#fffaf0;border-radius:18px;max-width:820px;margin:0 auto;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{color:#0e5f76;margin:0 0 6px}
p{line-height:1.8;margin:6px 0}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
th{background:#0e5f76;color:#fff;padding:9px;text-align:right}
td{padding:9px;border-bottom:1px solid #eadfca}
.ok{color:#1f9d5c;font-weight:bold}.no{color:#d6453a;font-weight:bold}.wait{color:#888}
.sum{margin-top:14px;padding:12px;border-radius:12px;background:#eef7f9;font-weight:bold;line-height:1.8}
button{font:inherit;font-weight:bold;background:#0e5f76;color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;margin-top:10px}
small{color:#5d6f78}
</style>
</head>
<body>
<div class="card">
  <h1>🔎 فحص الشبكة</h1>
  <p>افتحي هذه الصفحة على <b>جهاز طالبة</b> وهو متصل بشبكة المدرسة، وانتظري حتى ينتهي الفحص (حوالي 20 ثانية)، ثم <b>صوّري الجدول كاملًا</b> وأرسليه.</p>
  <table>
    <thead><tr><th>#</th><th>الخدمة</th><th>النتيجة</th><th>التفاصيل</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="sum" id="sum">⏳ جارٍ الفحص…</div>
  <button onclick="run()">🔄 إعادة الفحص</button>
  <p><small id="ua"></small></p>
</div>
<script>
const TESTS=[
  ['موقعك: الصفحة العادية','/config.js'],
  ['موقعك: الوسيط /api/gs','/api/gs'],
  ['موقعك: الوسيط /s.js','/s.js'],
  ['Google Apps Script','https://script.google.com/macros/s/x/exec'],
  ['Firebase Realtime Database','https://qatar-coder-test-default-rtdb.firebaseio.com/.json'],
  ['Firebase Firestore','https://firestore.googleapis.com/v1/projects/qatar-coder-test/databases/(default)/documents/t/a'],
  ['Supabase','https://abcdefghijklmnopqrst.supabase.co/rest/v1/'],
  ['Microsoft Graph','https://graph.microsoft.com/v1.0/'],
  ['GitHub API','https://api.github.com/zen'],
  ['JSONBin','https://api.jsonbin.io/v3/b/000000000000000000000000'],
  ['ntfy','https://ntfy.sh/v1/health'],
  ['Cloudflare Workers','https://workers.cloudflare.com/cf.json'],
  ['Pusher','https://sockjs.pusher.com/'],
  ['Ably','https://rest.ably.io/time']
];
function row(i,name){return `<tr><td>${i+1}</td><td>${name}</td><td id="r${i}" class="wait">⏳</td><td id="d${i}"><small></small></td></tr>`}
async function probe(i,url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{signal:c.signal,cache:'no-store'});
    clearTimeout(t);
    let body='';try{body=(await r.text()).slice(0,300)}catch(e){}
    const blocked=/Access to this site is blocked|saaed|Proxy Connection Request/i.test(body);
    if(blocked){set(i,false,'صفحة حجب الوزارة (HTTP '+r.status+')');return false}
    set(i,true,'وصل الطلب (HTTP '+r.status+')');return true;
  }catch(e){clearTimeout(t);set(i,false,e.name==='AbortError'?'انتهى الوقت':'محجوب أو غير متاح');return false}
}
function set(i,ok,msg){const r=document.getElementById('r'+i);r.className=ok?'ok':'no';r.textContent=ok?'✅ مسموح':'❌ محجوب';document.getElementById('d'+i).innerHTML='<small>'+msg+'</small>'}
async function run(){
  document.getElementById('rows').innerHTML=TESTS.map((x,i)=>row(i,x[0])).join('');
  document.getElementById('sum').textContent='⏳ جارٍ الفحص…';
  const res=await Promise.all(TESTS.map((x,i)=>probe(i,x[1])));
  const ok=TESTS.filter((x,i)=>res[i]).map(x=>x[0]);
  document.getElementById('sum').innerHTML='✅ المسموح: '+(ok.length?ok.join('، '):'لا شيء')+'<br>📅 '+new Date().toLocaleString('ar-QA-u-nu-latn');
}
document.getElementById('ua').textContent=navigator.userAgent;
run();
</script>
</body>
</html>
